plugin {
    hy3 {
        # hy3 config here
        no_gaps_when_only = 0
        node_collapse_policy = 2
        group_inset = 0
        tab_first_window = false
        tabs {
            # 18
            height = 18
            padding = 0
            from_top = false
            radius = 0
            border_width = 0
            render_text = true
            text_center = true
            text_font = JetBrainsMono Nerd Font
            text_height = 11
            blur = true
            opacity = 1.0

            col.active = rgba(28282899)
            col.focused = rgba(28282899)
            col.inactive = rgba(28282899)

            col.active.text = rgba(fe8019ff)
            col.focused.text = rgba(d65d0eff)
            col.inactive.text = rgba(ebdbb2ff)
        }
        autotile {
            enable = false
        }
    }
    overview {
        overrideGaps = false
        panelColor = rgba(40,40,40,0.6)
    }
}
