binds {
    workspace_back_and_forth = true
}

cursor {
    no_warps = true
}

ecosystem {
    no_donation_nag = true
}

windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}

